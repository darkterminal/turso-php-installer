name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml.dist"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml.dist"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer metadata
        run: composer validate --strict --no-check-publish --no-check-version

      - name: Run tests
        run: vendor/bin/pest --colors=never

name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml.dist"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml.dist"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer metadata
        run: composer validate --strict --no-check-publish --no-check-version

      - name: Run tests
        run: vendor/bin/pest --colors=never

  # Plan 006: the local development helpers need a real libSQL extension.
  # The installer cannot fetch one yet (issue #35: upstream releases ship no
  # release_metadata.json), so this job loads the official release binary
  # directly. Switch to `turso-php-installer install` once #35 is fixed.
  helpers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Load the stable extension binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ext" "$RUNNER_TEMP/php"
          RELEASE=$(curl -fsSL https://api.github.com/repos/tursodatabase/turso-client-php/releases/latest)
          TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          ASSET=$(echo "$RELEASE" | jq -r '.assets[].name' | grep 'php-8\.4-nts-x86_64-unknown-linux-gnu\.tar\.gz$' | head -n 1)
          test -n "$ASSET"
          curl -fsSL -o "$RUNNER_TEMP/ext.tar.gz" "https://github.com/tursodatabase/turso-client-php/releases/download/$TAG/$ASSET"
          tar -xzf "$RUNNER_TEMP/ext.tar.gz" -C "$RUNNER_TEMP/ext"
          SO=$(find "$RUNNER_TEMP/ext" -name '*.so' | head -n 1)
          test -n "$SO"
          cp "$(php -r 'echo php_ini_loaded_file();')" "$RUNNER_TEMP/php/php.ini"
          echo "extension=$SO" >> "$RUNNER_TEMP/php/php.ini"
          PHPRC="$RUNNER_TEMP/php/php.ini" php -m | grep -i libsql

      - name: Run helper tests
        env:
          PHPRC: ${{ runner.temp }}/php/php.ini
        run: php -c "$RUNNER_TEMP/php/php.ini" vendor/bin/pest --colors=never --group=helpers

name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml.dist"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml.dist"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer metadata
        run: composer validate --strict --no-check-publish --no-check-version

      - name: Run tests
        run: vendor/bin/pest --colors=never

  # Plan 006: the local development helpers need a real libSQL extension.
  # The installer cannot fetch one yet (issue #35: upstream releases ship no
  # release_metadata.json), so this job loads the official release binary
  # directly. Switch to `turso-php-installer install` once #35 is fixed.
  helpers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install the stable extension via the installer
        run: php turso-php-installer install -n --php-version=8.4

      - name: Run helper tests
        run: vendor/bin/pest --colors=never --group=helpers

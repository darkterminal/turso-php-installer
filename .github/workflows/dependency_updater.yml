name: Composer Update

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays at midnight UTC
    - cron: '0 0 * * 3' # Wednesdays at midnight UTC
    - cron: '0 0 * * 5' # Fridays at midnight UTC
  workflow_dispatch: # on-demand run from the Actions tab, e.g. for a release-time lock refresh

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Specify your PHP version
          tools: composer

      - name: Update Composer dependencies
        run: composer update

      - name: Commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add composer.json composer.lock
          git commit -m "Automated Composer update" || echo "No changes to commit"
          git push
